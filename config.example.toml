# PalIntel configuration.
#
# Copy to config.local.toml and fill in. config.local.* is gitignored: the token is a
# credential and the save path is machine-specific.
#
#   copy config.example.toml config.local.toml
#
# Every value can also come from the environment, which wins over the file:
#   PALINTEL_DISCORD_TOKEN, PALINTEL_CHANNEL_ID, PALINTEL_DATA_VERSION

[output]
# Where an answer goes. "discord" (below) or "local" - a Chat tab in the console
# (`python -m palintel.ui`) instead of a Discord channel, for a player who does not
# have or does not want Discord. Exclusive, never both at once - see ADR-0018.
#
# "local" needs no [discord] section filled in at all: token/channel_id below are only
# required when medium = "discord".
medium = "discord"

# How often the console tails the local chat feed, and how often the bot polls for a
# newly typed query, in milliseconds. Local medium only - meaningless under "discord",
# which delivers directly with no polling anywhere. Both are starting guesses, not
# measurements; lower them if replies feel laggy, raise them if that matters more than
# responsiveness (a background/idle install, for instance).
poll_ms = 300
inbox_poll_ms = 150

[discord]
# Bot token from https://discord.com/developers/applications -> your app -> Bot.
# Treat it like a password. Anyone holding it controls the bot.
# Only required when [output] medium = "discord".
token = ""

# Channel the bot listens in and posts to. Enable Developer Mode in Discord
# (Settings -> Advanced), then right-click the channel -> Copy Channel ID.
# Only required when [output] medium = "discord".
channel_id = 0

# How to address the bot in that channel:
#   "any"     - respond to every message. Fine for a dedicated #copilot-hud channel.
#   "prefix"  - respond only to messages starting with `prefix`.
#   "mention" - respond only when the bot is @mentioned.
listen_mode = "any"
prefix = "?"

[voice]
# Listen on the local microphone. Leave false to run text-only.
#
# Input is the local mic, not a Discord voice channel: Discord's DAVE end-to-end
# encryption broke voice reception in py-cord (Pycord-Development/pycord#3139), where
# the connection succeeds, a sink attaches, and no audio ever arrives. Output is still
# a Discord channel - only the input moved. The trade-off is that party members cannot
# ask by voice; they keep the text path.
enabled = false

# Input device: an index, a name substring, or omit for the system default.
# Run `python -c "from palintel.mic import devices; print(devices())"` to list them.
# device = 1

# Who the microphone belongs to. Conversation memory is per person, and the text path
# keys on your Discord display name - so setting this to the same name is what lets you
# ask by voice and follow up by text ("where can I find Chillet" ... "what about the
# alpha?"). Left unset, spoken queries are attributed to "voice" and keep their own
# thread, because guessing which Discord user is at the machine would attribute speech
# to the wrong person in a shared channel.
# speaker = "YourDiscordName"

# Wake-word models. Bare names are openWakeWord's pretrained set
# (hey_jarvis, hey_mycroft, hey_rhasspy, alexa); "hey_pal" is the custom model built
# by tools/wakeword/. Several can run at once - inference is CPU-bound at a realtime
# factor near 0.015, the highest score wins, so a second model only adds sensitivity.
# Useful while a custom model is being evaluated against a known-good one.
models = ["hey_pal"]

# Firing threshold, 0-1. Lower catches more genuine activations and more chatter.
#
# 0.1 is measured, not guessed. Against 236 real recordings of this phrase, hey_pal
# recalls 91.9% at 0.1 and 79.2% at 0.5, while the highest score any non-wake-word clip
# reached was 0.001 - so within the evidence available, lower is strictly better. Misses
# are bunched near zero rather than just under the line (13 clips score below 0.05), so
# 94.5% is the ceiling any threshold can reach.
#
# The caveat is that the negative evidence is thin: a handful of clips, no continuous
# room chatter. ADR-0004 argues for biasing low anyway, because a false negative is
# silent and a false positive is not - and a false positive is now *visible*, as an
# activation with no transcript in `/palintel status`. If that count climbs during real
# play, raise this.
threshold = 0.1

[router]
# The fast path answers a clearly-phrased resource query from the knowledge base without
# calling the model at all. The model round trip is a ~2s median and the whole voice
# budget is 2.5s, so on "where's the nearest coal" that round trip IS the latency problem.
# Nothing is skipped that the model would have done better: the stub only claims a query
# when the phrasing is unambiguous, and defers everything else.
#
#   fast_path = false   every query goes to the model. Restores the earlier behaviour
#                       exactly, at the cost of ~2s on queries the stub could answer.
fast_path = true

# How eagerly the fast path claims a query. Measured on the 15 A5 prompts a Q1 build can
# answer, with precision checked across all 232 - a wider list fails by stealing queries
# from OTHER classes, so Q1 alone cannot show the damage:
#
#   standard    8/15 = 53%   only explicit place words (where, nearest, find, ...)
#   proximity  10/15 = 67%   adds near, nearby, around here
#   wide       11/15 = 73%   adds i need, get me, any
#
# No width answered a wrong resource or claimed anything outside Q1. Hold that lightly:
# 15 prompts is thin, and "wide" is the only one that guesses at intent rather than
# naming a place, so it is the first thing to step back if a fast, confident, wrong card
# ever shows up. Drop to "proximity" - the coverage cost is two queries.
cues = "wide"

[cards]
# Artwork on answer cards (ADR-0017, accepted). On by default; the flag is the off
# switch, kept because the assets are a separate build and a checkout without them must
# still answer.
#
# Both need assets extracted from your own game install, which is a two-step build and
# about 20 MB on disk:
#
#   dotnet run --project tools/extract/PakExtract -- textures
#   python tools/ingest/build_assets.py --version 1.0.2
#
# Without them these silently stay off: the text card is the whole answer either way,
# and a missing picture is not worth refusing to start over.
#
#   maps    a cropped world map with the results numbered on it, matching the card's
#           own numbering. Drawn only when every point sits inside one published map
#           region - the World Tree is a separate map, and a coordinate belonging to
#           neither gets no picture rather than a marker in open sea.
#   icons   the Pal's own game icon as a thumbnail, on Pal queries. Resource cards get
#           no thumbnail: the item's inventory icon was tried there and withdrawn, since
#           it shows the material in your pack rather than the rock in the world, which
#           is the thing that actually makes a deposit recognisable.
#
# Neither is on the graded latency path: the text card is posted first and the picture
# is edited in on a second round trip, so the cost the player sees is a reflow rather
# than a slower answer. Rendering is ~24ms and ~60 KB.
maps = true
icons = true

[data]
# Which extracted dataset to load, matching a directory under data/.
version = "1.0.2"

[game]
# Palworld save directory - where "nearest", your roster and your technology tree come
# from.
#
# LEAVE IT EMPTY. The save root is derivable on Windows
# (%LOCALAPPDATA%\Pal\Saved\SaveGames\<steamid>\) and every world names itself in
# LevelMeta.sav, so the bot picks whichever world was written most recently and SAYS
# which one on /palintel status - "Explorers Refuge, host Rui, day 130". It follows you
# if you quit to menu and load a different world.
#
# Set it only to PIN one world - a stated path is never second-guessed. Useful if you
# keep two saves going and want answers about the one you are not currently in.
#
# NOTE THE SINGLE QUOTES. In TOML, single quotes make a *literal* string, so Windows
# backslashes work as-is. With double quotes, "C:\Users\..." fails to parse because
# \U starts a unicode escape.
#
#   save_dir = 'C:\Users\you\AppData\Local\Pal\Saved\SaveGames\<steamid>\<worldid>'
#   save_dir = "C:/Users/you/AppData/Local/Pal/Saved/SaveGames/..."   # also fine
save_dir = ''

# --- Gameplay capture -------------------------------------------------------
#
# Keeps the utterance audio the voice pipeline already writes, plus a log line saying
# what the router decided, so a play session builds an evaluation set as a side effect.
#
# Why it is worth having: every recording in data/stt_eval/ is a prompt READ ALOUD from
# a list, and read speech is hyperarticulated. The 68% entity accuracy measured there is
# therefore more likely optimistic than pessimistic, and real play is the only source of
# natural phrasing, game audio bleed and half-spoken questions.
#
# Cost is nil. bot.py already writes a WAV per utterance because faster-whisper reads a
# file rather than a buffer; capture means not deleting it. 16 kHz mono is 32 KB/s, so a
# long session is a few MB. Everything stays local - data/ is gitignored.
#
# TWO flags, deliberately. Saving audio and putting buttons on every card are different
# features with different costs, and this project has already learned that lesson once
# with [cards] maps/icons.
[capture]
# Save the clip and the log line. Records whatever is near the microphone, including
# other people in the room - which is why it is off unless you say otherwise.
enabled = false

# Show three labelling buttons under each answer card: mis-heard me, wrong Pal, wrong
# question. They ride in the same message as the card, so they cost no extra round trip,
# and they key on the message id - so a correction works minutes later and still lands
# on the right query. Buttons do not survive a bot restart.
feedback = false

[cost]
# What the router costs, logged per query to data/sessions/<session>/costs.jsonl and
# totalled on `/palintel status`. ON by default, unlike capture: a cost row is a number
# the process already computed and threw away, and it records nothing about you or
# anyone in the room.
#
# Only the router costs money. STT is local and free (ADR-0015), map crops and icons are
# local CPU, and every card is templated.
enabled = true

# What you actually loaded onto the API key, in US dollars. Spend is deducted from it and
# `/palintel status` shows what is left.
#
# Leave it at 0 to log and total spend without tracking a balance. Setting it is worth
# doing because running out is SILENT: a depleted balance arrives as HTTP 429, every 429
# becomes a Decline, and the roadmap records one eval reading that as a 13-point router
# regression before anyone thought to check the balance.
balance_usd = 0.0

# Start shouting about the balance below this. Eval runs are ~$1.40 each, so the default
# is roughly one run's warning.
warn_below_usd = 2.0
